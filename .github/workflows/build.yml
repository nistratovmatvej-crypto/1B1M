name: 1B1M Build

on:
  push:
    branches: [main]
    paths:
      - '1B1M-prototype.zip'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 1b1m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 26.3 / Fabric / Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract prototype sources
        shell: bash
        run: |
          set -euo pipefail
          test -s 1B1M-prototype.zip
          unzip -oq 1B1M-prototype.zip -d .
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java
          # Minecraft 26.1+ is unobfuscated; Loom no longer provides modImplementation.
          sed -i -E 's/^([[:space:]]*)modImplementation([[:space:]])/\\1implementation\\2/' build.gradle
          # The prototype uses a standalone assertion-based test runner, not JUnit.
          cat >> build.gradle <<'GRADLE'

          tasks.named('test') {
              enabled = false
          }

          tasks.register('verifyCore', JavaExec) {
              group = 'verification'
              description = 'Runs the standalone 1B1M core verification suite.'
              dependsOn tasks.named('testClasses')
              classpath = sourceSets.test.runtimeClasspath
              mainClass = 'dev.onebym.core.PrototypeTests'
              jvmArgs '-ea'
          }

          tasks.named('check') {
              dependsOn tasks.named('verifyCore')
          }
          GRADLE

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Inspect extracted build configuration and tests
        shell: bash
        run: |
          echo '--- build.gradle ---'
          sed -n '1,220p' build.gradle
          echo '--- gradle.properties ---'
          cat gradle.properties
          echo '--- settings.gradle ---'
          cat settings.gradle
          echo '--- PrototypeTests.java ---'
          sed -n '1,260p' src/test/java/dev/onebym/core/PrototypeTests.java

      - name: Build and run verification
        run: gradle --no-daemon clean build

      - name: Publish extracted source tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle.properties settings.gradle BUILD_STATUS.txt config src
          if ! git diff --cached --quiet; then
            git commit -m "build: unpack and normalize prototype sources"
            git push origin HEAD:main
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: 1B1M-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
