name: 1B1M Build

on:
  push:
    branches: [main]
    paths:
      - '1B1M-prototype.zip'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 1b1m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 26.3 / Fabric / Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract prototype sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -s 1B1M-prototype.zip ] && [ ! -d src/main/java ]; then
            unzip -oq 1B1M-prototype.zip -d .
          fi
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java
          sed -i 's/modImplementation/implementation/g' build.gradle
          if ! grep -q "tasks.register('verifyCore'" build.gradle; then
            cat >> build.gradle <<'GRADLE'

          tasks.named('test') { enabled = false }
          tasks.register('verifyCore', JavaExec) {
              group = 'verification'
              dependsOn tasks.named('testClasses')
              classpath = sourceSets.test.runtimeClasspath
              mainClass = 'dev.onebym.core.PrototypeTests'
              jvmArgs '-ea'
          }
          tasks.named('check') { dependsOn tasks.named('verifyCore') }
          GRADLE
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Inspect Minecraft 26.3 worldgen classes
        shell: bash
        run: |
          set -euo pipefail
          echo '--- cached Minecraft jars ---'
          find "$HOME/.gradle/caches" -type f -name '*.jar' | grep -Ei 'minecraft|client|merged' | head -80 || true
          while IFS= read -r jarfile; do
            if jar tf "$jarfile" 2>/dev/null | grep -q 'NoiseBasedChunkGenerator.class'; then
              echo "--- WORLDGEN CLASS JAR: $jarfile ---"
              for cls in \
                net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator \
                net.minecraft.world.level.levelgen.DensityFunction \
                net.minecraft.world.level.levelgen.NoiseRouter \
                net.minecraft.world.level.levelgen.RandomState \
                net.minecraft.world.level.levelgen.NoiseChunk; do
                echo "--- javap $cls ---"
                javap -classpath "$jarfile" -p "$cls" 2>&1 || true
              done
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*.jar')

      - name: Build and run verification
        run: gradle --no-daemon clean build

      - name: Publish extracted source tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle.properties settings.gradle BUILD_STATUS.txt config src
          if ! git diff --cached --quiet; then
            git commit -m "build: unpack and normalize prototype sources"
            git push origin HEAD:main
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: 1B1M-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
