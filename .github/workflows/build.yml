name: 1B1M Build

on:
  push:
    branches: [main]
    paths:
      - '1B1M-prototype.zip'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 1b1m-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Minecraft 26.3 / Fabric / Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract prototype sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -s 1B1M-prototype.zip ] && [ ! -d src/main/java ]; then unzip -oq 1B1M-prototype.zip -d .; fi
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java
          sed -i 's/modImplementation/implementation/g' build.gradle
          if ! grep -q "tasks.register('verifyCore'" build.gradle; then
            cat >> build.gradle <<'GRADLE'

          tasks.named('test') { enabled = false }
          tasks.register('verifyCore', JavaExec) {
              group = 'verification'
              dependsOn tasks.named('testClasses')
              classpath = sourceSets.test.runtimeClasspath
              mainClass = 'dev.onebym.core.PrototypeTests'
              jvmArgs '-ea'
          }
          tasks.named('check') { dependsOn tasks.named('verifyCore') }
          GRADLE
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Inspect DensityFunction API
        shell: bash
        run: |
          set -euo pipefail
          MC="$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client.jar"
          test -f "$MC"
          for cls in \
            net.minecraft.world.level.levelgen.NoiseGeneratorSettings \
            net.minecraft.world.level.levelgen.densityfunction.DensityFunction \
            net.minecraft.world.level.levelgen.densityfunction.DensitySampler \
            net.minecraft.world.level.levelgen.densityfunction.DensityBuffer \
            net.minecraft.world.level.levelgen.densityfunction.DensityVolume \
            net.minecraft.world.level.levelgen.NoiseRouter \
            net.minecraft.world.level.levelgen.RandomState; do
            echo "--- javap $cls ---"
            javap -classpath "$MC" -p "$cls" 2>&1 || true
          done

      - name: Build and run core verification
        run: gradle --no-daemon clean build

      - name: Verify packaged mod
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'onebym.mixins.json'
          jar tf "$JAR" | grep -q 'dev/onebym/mixin/RandomStateMixin.class'
          jar tf "$JAR" | grep -q 'dev/onebym/worldgen/TerrainDensitySampler.class'
          unzip -p "$JAR" fabric.mod.json
          echo "Verified mod JAR: $JAR"

      - name: Runtime Overworld worldgen smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'PROPERTIES'
          online-mode=false
          server-port=25575
          level-name=1b1m-smoke-world
          level-seed=777
          level-type=minecraft:normal
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-players=1
          PROPERTIES
          set +e
          timeout 180s gradle --no-daemon runServer > server-smoke.log 2>&1
          server_exit=$?
          set -e
          cat server-smoke.log
          if [ "$server_exit" -ne 0 ] && [ "$server_exit" -ne 124 ]; then
            echo "Server smoke test exited with $server_exit"
            exit "$server_exit"
          fi
          grep -q 'Done (' server-smoke.log
          grep -q '1B1M TerrainSampler is now modifying the compiled Overworld final_density sampler' server-smoke.log
          echo 'PASS: Fabric server started and invoked the 1B1M final-density sampler hook.'

      - name: Publish extracted source tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle.properties settings.gradle BUILD_STATUS.txt config src
          if ! git diff --cached --quiet; then
            git commit -m "build: unpack and normalize prototype sources"
            git push origin HEAD:main
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: 1B1M-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
